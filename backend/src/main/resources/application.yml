spring:
  main:
    allow-circular-references: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reslot?stringtype=unspecified}
    username: ${DB_USER:reslot}
    password: ${DB_PASSWORD:reslot}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

server:
  port: 8080
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

app:
  jwt:
    signing-key: ${JWT_SIGNING_KEY:dev-secret-change-in-production-must-be-256-bits}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  admin:
    email: ${ADMIN_EMAIL:admin@rscoe.edu.in}
    initial-password: ${ADMIN_INITIAL_PASSWORD:ChangeMe123!}
  whatsapp:
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:reslot_verify_token}
    sandbox: ${WHATSAPP_SANDBOX:true}
  llm:
    api-key: ${GEMINI_API_KEY:${LLM_API_KEY:}}
    model: ${GEMINI_MODEL:${LLM_MODEL:gemini-3.8-flash}}
    monthly-token-budget: ${LLM_MONTHLY_TOKEN_BUDGET:100000}
  pii:
    encryption-key: ${PII_ENCRYPTION_KEY:dev-enc-key-32-chars-change-me!!}

reslot:
  solver:
    engine: ${RESLOT_SOLVER_ENGINE:heuristic}

logging:
  level:
    com.reslot: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [corr=%X{correlationId}] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/reslot?stringtype=unspecified
    username: reslot
    password: reslot
  flyway:
    locations: classpath:db/migration
logging:
  level:
    com.reslot: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reslot?stringtype=unspecified}
    username: ${DB_USER:reslot}
    password: ${DB_PASSWORD:reslot}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
logging:
  level:
    com.reslot: WARN
